name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Linux)
    runs-on: durative
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - name: Check
        run: scripts/check
      - name: Board-only size budget
        run: scripts/board-size
      - name: Board and examples without Python
        run: |
          scripts/without-python cargo build --locked -p malak --no-default-features
          scripts/without-python cargo run --locked -q -p malak --example team --no-default-features
