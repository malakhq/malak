[package]
name = "malak-journal"
description = "Board journal encoding and replay. Internal to Malak; no stability promise."
categories = ["encoding", "filesystem"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
repository.workspace = true

[dependencies]
cobs = "0.5"
sha2 = { version = "0.11", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
malak-fs = { path = "../malak-fs", version = "0.1.2" }
nix = { version = "0.31", features = ["dir", "fs", "user"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
malak-testkit = { path = "../malak-testkit", version = "0.1.2" }

[lints]
workspace = true
