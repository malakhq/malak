[package]
name = "malak-store-sqlite"
description = "Durable storage for Malak boards backed by SQLite"
categories = ["database"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
repository.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
getrandom = "0.3"
malak-fs = { path = "../malak-fs", version = "0.1.2" }
malak-layers = { path = "../malak-layers", version = "0.1.2" }
nix = { version = "0.31", features = ["fs", "user"] }
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
malak-testkit = { path = "../malak-testkit", version = "0.1.2" }

[lints]
workspace = true
