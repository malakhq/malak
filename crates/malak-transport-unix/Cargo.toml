[package]
name = "malak-transport-unix"
description = "Unix-domain and Firecracker vsock transports for Malak"
categories = ["network-programming", "os"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
repository.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
malak-layers = { path = "../malak-layers", version = "0.1.2" }
nix = { version = "0.31", features = ["socket", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31", features = ["poll"] }

[target.'cfg(target_os = "linux")'.dependencies]
getrandom = "0.3"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
malak-proto = { path = "../malak-proto", version = "0.1.2" }
malak-testkit = { path = "../malak-testkit", version = "0.1.2" }

[lints]
workspace = true
