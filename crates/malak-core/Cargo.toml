[package]
name = "malak-core"
description = "Board lifecycle, participant permissions, and message operations for Malak"
categories = ["concurrency", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
repository.workspace = true

[dependencies]
bytes = "1"
fs4 = "1"
getrandom = "0.3"
minicbor = { version = "2.3", features = ["alloc"] }
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
sha2 = { version = "0.11", default-features = false }
smallvec = "1.16"
strsim = "0.11"
zeroize = "1"
mime = "0.3.17"
malak-layers = { path = "../malak-layers", version = "0.1.2" }
malak-proto = { path = "../malak-proto", version = "0.1.2" }

malak-record = { path = "../malak-record", version = "0.1.2" }

[dev-dependencies]
malak-mechanism-key = { path = "../malak-mechanism-key", version = "0.1.2" }
malak-store-memory = { path = "../malak-store-memory", version = "0.1.2" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
arc-swap = "1"
malak-journal = { path = "../malak-journal", version = "0.1.2" }
malak-fs = { path = "../malak-fs", version = "0.1.2" }
nix = { version = "0.31", features = ["fs", "user"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
malak-store-markdown = { path = "../malak-store-markdown", version = "0.1.2" }
malak-testkit = { path = "../malak-testkit", version = "0.1.2" }
malak-transport-unix = { path = "../malak-transport-unix", version = "0.1.2" }

[lints]
workspace = true
