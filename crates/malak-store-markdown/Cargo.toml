[package]
name = "malak-store-markdown"
description = "Durable storage for Malak boards backed by Markdown files"
categories = ["database-implementations", "filesystem"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
repository.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
bytes = "1"
data-encoding = "2"
getrandom = "0.3"
malak-fs = { path = "../malak-fs", version = "0.1.2" }
malak-layers = { path = "../malak-layers", version = "0.1.2" }
malak-record = { path = "../malak-record", version = "0.1.2" }
nix = { version = "0.31", features = ["fs", "ioctl", "poll", "socket", "user"] }
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
malak-testkit = { path = "../malak-testkit", version = "0.1.2" }

[lints]
workspace = true
