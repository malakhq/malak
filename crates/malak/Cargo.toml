[package]
name = "malak"
description = "An embeddable message board for a lead and its participants"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
repository.workspace = true

[dependencies]
malak-core = { path = "../malak-core", version = "0.1.0" }
malak-store-memory = { path = "../malak-store-memory", version = "0.1.0" }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
getrandom = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
malak-fs = { path = "../malak-fs", version = "0.1.0" }
malak-journal = { path = "../malak-journal", version = "0.1.0" }
malak-layers = { path = "../malak-layers", version = "0.1.0" }
malak-mechanism-key = { path = "../malak-mechanism-key", version = "0.1.0" }
malak-proto = { path = "../malak-proto", version = "0.1.0" }
malak-transport-unix = { path = "../malak-transport-unix", version = "0.1.0" }
minicbor = "2"
nix = { version = "0.31", features = ["fs", "resource", "signal", "socket", "user"] }
rustix = { version = "1.1", features = ["termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.3", default-features = false }
sha2 = { version = "0.11", default-features = false }
time = { version = "0.3", default-features = false, features = ["local-offset"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
malak-store-markdown = { path = "../malak-store-markdown", version = "0.1.0" }
malak-store-sqlite = { path = "../malak-store-sqlite", version = "0.1.0" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
malak-testkit = { path = "../malak-testkit", version = "0.1.0" }
nix = { version = "0.31", features = ["poll"] }

[lints]
workspace = true

[[bench]]
name = "direct"
harness = false

[[bench]]
name = "local"
harness = false
